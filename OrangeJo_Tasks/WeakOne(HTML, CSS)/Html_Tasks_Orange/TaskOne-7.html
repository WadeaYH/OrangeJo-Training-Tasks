<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
</head>
<body>
    <h1>Registration Form</h1>
    <form>
        <fieldset style="width: 300px; padding: 10px;">
            <legend>Registration Information</legend>
        <h3>Personal Details</h3>

        <hr>
        <br>
        <label for="FirstName">First Name:</label>
        <input type="text" id="FirstName" name="FirstName" required><br><br>

        <label for="LastName">Last Name:</label>
        <input type="text" id="LastName" name="LastName" required><br><br>

        <label for="Email">Email:</label>
        <input type="email" id="Email" name="Email" required><br><br>

        <label for="Gender">Gender:</label>
        <input type="radio" id="Male" name="Gender" value="Male" required>
        <label for="Male">Male</label>
        <input type="radio" id="Female" name="Gender" value="Female" required>
        <label for="Female">Female</label>
        <br><br>

        <label for="City">City:</label>
        <select id="City" name="City" required>
            <option value="">Select a city</option>
            <option value="New York">Alzarqaa</option>
            <option value="Los Angeles">Amman</option>
            <option value="Chicago">Ajloun</option>
            <option value="Houston">Irbid</option>
            <option value="Phoenix">Aqaba</option>
        </select>

        <br><br>
        <input type="submit" value="Sign Up">
        </fieldset>
    </form>

    <br><br>
    <button onclick="window.location.href='TaskOne-6.html';">Back</button>
</body>
</html>
